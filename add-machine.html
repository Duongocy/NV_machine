<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm máy vào hệ thống - Add machine to system</title>
    <link rel="stylesheet" href="add-machine.css">
    <link rel="icon" href="iconinv.ico" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
</head>
<!-- Code của trang login được viết ở đây -->
<body>
    <div class="add-machine-head" id="addMachineHead"></div>
    <form class="input-box">
        <div class="input-title">
            Thêm máy mới vào hệ thống
        </div>
        <div class="detail-input-box">
            <input id="machineId" type="text" placeholder="Số máy (Machine No)" required>
            <input id="machineName" type="text" placeholder="Tên máy (Machine Name)" required>
            <input id="machineModel" type="text" placeholder="Model" required>
            <input id="checkingCycle" type="number" placeholder="Chu kỳ kiểm tra (Routine Check)" required>
            <input id="machineMaker" type="text" placeholder="Nhà sản xuất (Machine Maker)" required>
            <input id="installationArea" type="text" placeholder="Khu vực sử dụng (Installation Area)" required>
        </div>
        <div class="button-box">
            <button type="submit" id="record-btn" autocomplete="off">Thêm máy vào hệ thống</button>
        </div>
    </form>

    <script src="add-machine.js"></script>
</body>
</html>
