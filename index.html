<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" href="iconinv.ico" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
</head>
<!-- Code của trang login được viết ở đây -->
<body>
     <form class="login-box">
        <div class="login-title">
            Login NV_Machine
        </div>
        <div class="id-and-pass-box">
            <input id="input-name" type="text" placeholder="Name" autocomplete="new-email" required>
            <input id="input-pass" type="password" placeholder="Password" autocomplete="new-password" required>
        </div>
        <div class="button-box">
            <button type="submit" id="login-button" autocomplete="off">Sign In</button>
        </div>
    </form>
    <script src="index.js"></script>
</body>
</html>
